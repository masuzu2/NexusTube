<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusTube โหลด</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; }
    body { font-family: "Kanit", "Leelawadee UI", "Segoe UI", sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: flex; height: 100%; }
    aside {
      width: 250px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.9);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .side-head, .folder { padding: 16px; }
    .side-head { display: flex; justify-content: space-between; align-items: center; }
    .side-head h1 { margin: 0; font-size: 16px; font-weight: 500; }
    hr { width: 60px; border: 0; border-top: 1px solid rgba(255, 255, 255, 0.3); margin: 0 auto; }
    #queue { flex: 1; overflow: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
    .folder { display: grid; gap: 8px; }
    .folder input, select, .quiet {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 0;
      border-radius: 12px;
      padding: 8px 12px;
      outline: none;
    }
    .quiet { text-align: center; }
    main { flex: 1; min-width: 0; overflow: auto; padding: 16px 16px 32px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { font-weight: 700; }
    .engines { font-size: 13px; opacity: 0.7; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 99px; margin-right: 6px; background: #f075b0; }
    .dot.on { background: #86efac; }
    .search-wrap { max-width: 420px; margin: 18px auto 0; display: grid; gap: 8px; }
    form { display: flex; gap: 8px; align-items: center; background: rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 6px 6px 6px 14px; }
    #query { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; }
    #go { background: #fff; color: #000; border: 0; border-radius: 12px; padding: 8px 14px; font-weight: 500; }
    #go:disabled { opacity: 0.6; }
    #note { min-height: 1.2em; text-align: center; font-size: 13px; opacity: 0.7; }
    #note.err { color: #fda4af; opacity: 1; }
    #results { max-width: 720px; margin: 8px auto 0; display: grid; gap: 8px; }
    article {
      display: grid;
      grid-template-columns: 92px 1fr auto;
      gap: 10px;
      align-items: center;
      background: #18181b;
      border-radius: 8px;
      overflow: hidden;
      padding-right: 8px;
    }
    img { width: 92px; height: 52px; object-fit: cover; background: #27272a; }
    strong { display: block; font-weight: 500; }
    .meta { font-size: 13px; opacity: 0.55; }
    .err { color: #fda4af; font-size: 13px; }
    .row { display: flex; gap: 6px; }
    article > button {
      background: #fff;
      color: #000;
      border: 0;
      border-radius: 12px;
      padding: 6px 10px;
      font-weight: 500;
    }
    article .quiet { width: auto; padding: 6px 10px; background: rgba(255, 255, 255, 0.1); color: #fff; }
    #queue article { grid-template-columns: 48px 1fr; padding-right: 0; }
    #queue img { width: 48px; height: 48px; }
    #queue .row { grid-column: 1 / -1; padding: 0 8px 8px; }
    #queue a.quiet { display: inline-block; text-decoration: none; text-align: center; }
    #queue .err {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .empty { opacity: 0.5; font-size: 14px; }
    @media (max-width: 800px) {
      .app { flex-direction: column; }
      aside { width: 100%; height: 42%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="side-head">
        <h1>คิวโหลด</h1>
        <button type="button" id="clear-done" class="quiet">ล้างที่จบ</button>
      </div>
      <hr>
      <div id="queue" class="empty">ยังไม่มีงาน</div>
      <div class="folder">
        <input id="folder" type="text" aria-label="โฟลเดอร์เก็บไฟล์">
        <button type="button" id="save-folder" class="quiet">ตั้งโฟลเดอร์</button>
        <button type="button" id="open-folder" class="quiet">เปิดโฟลเดอร์</button>
      </div>
    </aside>
    <main>
      <div class="top">
        <div>
          <div class="brand">NexusTube</div>
          <div class="engines">หน้านี้ใช้โหลดอย่างเดียว เครื่องเล่นอยู่ในโปรแกรม</div>
        </div>
        <div class="engines"><span id="engine-dot" class="dot"></span><span id="engine-text">กำลังตรวจเครื่องมือ</span></div>
      </div>
      <div class="search-wrap">
        <form id="grab">
          <input id="query" type="text" placeholder="ค้นหาเพลง" autocomplete="off" required>
          <button type="submit" id="go">โหลด</button>
        </form>
        <select id="format" aria-label="รูปแบบไฟล์">
          <option value="mp3_320">MP3 320k</option>
          <option value="m4a_best">M4A</option>
          <option value="flac">FLAC</option>
          <option value="mp4_1080">MP4 1080p</option>
          <option value="mp4_720">MP4 720p</option>
          <option value="mp4_best">MP4 สูงสุด</option>
        </select>
        <p id="note"></p>
      </div>
      <div id="results"></div>
    </main>
  </div>
  <script src="download.js?v=3"></script>
</body>
</html>
